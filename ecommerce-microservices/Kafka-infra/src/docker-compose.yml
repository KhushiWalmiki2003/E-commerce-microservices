version: "3.8"
services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KFAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NOTE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_CFG_LISTNERS=PLANTEXT://9092,CONTROLLER://9093
      - KAFKA_CFG_ADVERTISED_LISTNERS=PLANTEXT://localhost:9092
      - KAFKA_CFG_LISTNER_SECURITY_PROTOCOL_MAP=PLANTEXT:PLANTEXT,CONTROLLER:PLANTEXT
      - KAFKA_CFG_CONTROLLER_LISTNER_NAME=CONTROLLER

      - KAFKA_CFG_AUTO_CREATE_TOPIC_ENABLE=true
      - ALLOW_PLANTEXT_LISTNER=yes
    volumes:
        - kafka_data:/bitnami/kafka

volumes:
  kafka_data:
