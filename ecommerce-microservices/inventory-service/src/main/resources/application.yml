spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.comman.seralization.StringDeserializer
      value-deseralizer: org.springframework.kafka.support.seralizer.JsonDeseralizer
      properties:
        spring.json.trusted.packages: "*"